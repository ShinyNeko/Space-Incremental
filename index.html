<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Incremental</title>
</head>
<body>
    <p id="ironCount">0 Iron</p>
    <div>
        <button onclick="tab('mineMenu')">Mine Menu</button>
        <button onclick="tab('upgradeMenu')">Upgrade Menu</button>
    </div>
    <div id="mineMenu">
        <button id="mineButton" onclick="mineIron()">Mine Iron</button>
    </div>
    <div id="upgradeMenu">
        <spam id="perClickUpgrade">Upgrade Per Click (per Click 1)</spam><button id="perClickUpgradeButton" onclick="upgradeIronPerClick()"> Cost: 10 Iron</button><br>
        <span id="perSecondUpgrade">Upgrade Per Second (per Second 0)</span><button id="perSecondUpgradeButton" onclick="upgradeIronPerSecond()"> Cost: 100 Iron</button>
    </div>
    <script src="main.js" charset="utf-8" type="text/javascript"></script>
